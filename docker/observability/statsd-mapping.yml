# Airflow's StatsD metrics as Prometheus metrics with labels (prom/statsd-exporter).
# Timers arrive in milliseconds and are exported in seconds. Task ids contain dots
# (process.index), hence the regular expressions where a task id is part of the name.
defaults:
  observer_type: histogram
  histogram_options:
    buckets: [1, 5, 10, 30, 60, 120, 300, 600, 1200, 3600]
mappings:
  - match: 'airflow\.dagrun\.duration\.(success|failed)\.(.+)'
    match_type: regex
    name: airflow_dagrun_duration_seconds
    labels: {state: '$1', dag_id: '$2'}

  - match: 'airflow\.ti\.finish\.([^.]+)\.(.+)\.([a-z_]+)'
    match_type: regex
    name: airflow_task_finished_total
    labels: {dag_id: '$1', task_id: '$2', state: '$3'}

  - match: 'airflow\.ti\.start\.([^.]+)\.(.+)'
    match_type: regex
    name: airflow_task_started_total
    labels: {dag_id: '$1', task_id: '$2'}

  - match: 'airflow\.dag\.([^.]+)\.(.+)\.duration'
    match_type: regex
    name: airflow_task_duration_seconds
    labels: {dag_id: '$1', task_id: '$2'}

  - match: 'airflow.ti_successes'
    name: airflow_task_successes_total
  - match: 'airflow.ti_failures'
    name: airflow_task_failures_total

  - match: 'airflow.executor.*'
    name: 'airflow_executor_${1}'

  - match: 'airflow.pool.*.*'
    name: 'airflow_pool_${1}'
    labels: {pool: '$2'}

  - match: 'airflow.scheduler.heartbeat'
    name: airflow_scheduler_heartbeat_total

  # Everything else Airflow sends is dropped rather than exported under made-up names.
  - match: '.'
    match_type: regex
    action: drop
    name: dropped

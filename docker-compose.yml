# The project name: container labels and volume names start with it (Alloy keeps only its logs).
name: marginalia-rag

# Qdrant for this project only. Host ports 6340/6341 avoid the 6333 already
# taken on this machine (WSL) and pronet's Qdrant on 6335.
# Airflow (`docker compose --profile airflow up -d --build`): processes uploaded books in batches,
# on $CP_INGEST_SCHEDULE. Tasks run under the LocalExecutor inside the scheduler container.
x-airflow: &airflow
  build: {context: ., dockerfile: docker/airflow/Dockerfile}
  image: marginalia-airflow:dev
  profiles: [airflow]
  # The same user as the api and worker containers (uid 1000, see Dockerfile), so every container
  # can write the book folders the others created. Airflow's image supports any uid with group 0.
  user: "1000:0"
  restart: unless-stopped
  environment: &airflow_env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: 8
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://marginalia:${CP_POSTGRES_PASSWORD:-marginalia}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${CP_AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${CP_AIRFLOW_JWT_SECRET:-change-me}
    # Signs the sign-in session of Airflow's UI. Without a fixed value each container makes up its
    # own on every start, and pages or cookies from before a restart fail with "The CSRF session
    # token is missing".
    AIRFLOW__API__SECRET_KEY: ${CP_AIRFLOW_SECRET_KEY:-change-me}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    CP_INGEST_SCHEDULE: ${CP_INGEST_SCHEDULE:-@hourly}
    # marginalia settings for the batch tasks
    CP_DATABASE_URL: postgresql+asyncpg://marginalia:${CP_POSTGRES_PASSWORD:-marginalia}@postgres:5432/marginalia
    CP_REDIS_URL: redis://redis:6379/0
    CP_QDRANT_URL: http://qdrant:6333
    CP_OLLAMA_URL: http://ollama:11434
    CP_OLLAMA_NUM_PARALLEL: ${CP_OLLAMA_NUM_PARALLEL:-2}
    CP_GUARD_MODEL: ${CP_GUARD_MODEL:-qwen3:4b}
    CP_COVERS_ONLINE: ${CP_COVERS_ONLINE:-1}
    # Airflow's metrics (run and task outcomes, durations) to the StatsD exporter, for Prometheus
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./library:/data/library
    - app_models:/data/models
    - airflow_logs:/opt/airflow/logs

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: marginalia-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6340:6333"   # HTTP / REST
      - "127.0.0.1:6341:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # This project's own Ollama, separate from pronet's. Tuned through .env (see .env.example).
  # The CP_ prefix keeps OLLAMA_* variables set globally for other Ollama installs from leaking in.
  ollama:
    image: ollama/ollama:0.12.3
    container_name: marginalia-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CP_OLLAMA_PORT:-11435}:11434"
    environment:
      # Requests served at once. Each slot holds its own KV cache (~2.2 GB for qwen3:4b at a
      # 16k context with f16, ~1.1 GB with q8_0), so this is bounded by GPU memory.
      OLLAMA_NUM_PARALLEL: ${CP_OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_FLASH_ATTENTION: ${CP_OLLAMA_FLASH_ATTENTION:-1}
      # f16 | q8_0 | q4_0. Quantized KV caches need flash attention and roughly halve memory per slot.
      OLLAMA_KV_CACHE_TYPE: ${CP_OLLAMA_KV_CACHE_TYPE:-f16}
      OLLAMA_KEEP_ALIVE: ${CP_OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: ${CP_OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17.6-alpine
    container_name: marginalia-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CP_POSTGRES_PORT:-5440}:5432"
    environment:
      POSTGRES_DB: marginalia
      POSTGRES_USER: marginalia
      POSTGRES_PASSWORD: ${CP_POSTGRES_PASSWORD:-marginalia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marginalia -d marginalia"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Job queue (streams), live events (pub/sub) and rate limits.
  redis:
    image: redis:8.2.1-alpine
    container_name: marginalia-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${CP_REDIS_PORT:-6390}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The application: `docker compose --profile app up -d --build`. Without the profile, only the
  # services above start, for running the API and worker on the host during development.
  api:
    build: .
    image: marginalia:dev
    container_name: marginalia-api
    profiles: [app]
    command: api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CP_API_PORT:-8010}:8010"
    environment: &app_env
      CP_ENV: ${CP_ENV:-development}
      # JSON log lines, one per event, for Loki (marginalia.logs)
      CP_LOG_FORMAT: ${CP_LOG_FORMAT:-json}
      CP_LOG_LEVEL: ${CP_LOG_LEVEL:-INFO}
      # Prometheus metrics inside the compose network (marginalia.metrics); never published
      CP_METRICS_PORT: "9100"
      CP_GRAFANA_URL: ${CP_GRAFANA_URL:-http://127.0.0.1:3030}
      CP_EVIDENTLY_UI_URL: ${CP_EVIDENTLY_UI_URL:-http://127.0.0.1:8085}
      CP_JWT_SECRET: ${CP_JWT_SECRET:-}
      # The admin account set up at start (sign in to the web UI with these)
      CP_ADMIN_EMAIL: ${CP_ADMIN_EMAIL:-}
      CP_ADMIN_PASSWORD: ${CP_ADMIN_PASSWORD:-}
      CP_DATABASE_URL: postgresql+asyncpg://marginalia:${CP_POSTGRES_PASSWORD:-marginalia}@postgres:5432/marginalia
      CP_REDIS_URL: redis://redis:6379/0
      CP_QDRANT_URL: http://qdrant:6333
      CP_OLLAMA_URL: http://ollama:11434
      CP_OLLAMA_NUM_PARALLEL: ${CP_OLLAMA_NUM_PARALLEL:-2}
      CP_GUARD_MODEL: ${CP_GUARD_MODEL:-qwen3:4b}
      CP_MAX_UPLOAD_MB: ${CP_MAX_UPLOAD_MB:-100}
      CP_AIRFLOW_URL: http://airflow-apiserver:8080
      CP_AIRFLOW_USER: ${CP_AIRFLOW_USER:-admin}
      CP_AIRFLOW_PASSWORD: ${CP_AIRFLOW_PASSWORD:-change-me}
      # The worker's question guard and answer cache (see .env.example)
      CP_INJECTION_MODEL: ${CP_INJECTION_MODEL-protectai/deberta-v3-base-prompt-injection-v2}
      CP_CACHE_SIMILARITY: ${CP_CACHE_SIMILARITY:-0.97}
    volumes: &app_volumes
      - ./library:/data/library        # the same library the host CLI uses
      - app_models:/data/models        # e5, BM25 and the injection classifier, downloaded once
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: marginalia:dev
    container_name: marginalia-worker
    profiles: [app]
    command: worker
    restart: unless-stopped
    environment: *app_env
    volumes: *app_volumes
    depends_on:
      api: {condition: service_healthy}      # migrations have run
      qdrant: {condition: service_healthy}
      ollama: {condition: service_healthy}

  db-init:
    # One-shot, on every `up`: Airflow's database, and the read-only login for dashboards and
    # monitoring (docker/postgres/db-init.sh). Idempotent.
    image: postgres:17.6-alpine
    profiles: [airflow, observability]
    environment:
      CP_POSTGRES_PASSWORD: ${CP_POSTGRES_PASSWORD:-marginalia}
      CP_REPORTING_DB_PASSWORD: ${CP_REPORTING_DB_PASSWORD:-change-me}
    volumes:
      - ./docker/postgres/db-init.sh:/db-init.sh:ro
    command: ["sh", "/db-init.sh"]
    depends_on:
      postgres: {condition: service_healthy}

  airflow-init:
    <<: *airflow
    restart: "no"
    command: >-
      bash -c "airflow pools set marginalia_gpu 1 'LLM work on the shared Ollama'
      && airflow pools set marginalia_cpu 2 'Chapter detection and embedding'"
    environment:
      <<: *airflow_env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${CP_AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${CP_AIRFLOW_PASSWORD:-change-me}
    depends_on:
      db-init: {condition: service_completed_successfully}

  airflow-apiserver:
    <<: *airflow
    container_name: marginalia-airflow-apiserver
    command: api-server
    ports:
      - "127.0.0.1:${CP_AIRFLOW_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-scheduler:
    <<: *airflow
    container_name: marginalia-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}

  airflow-dag-processor:
    <<: *airflow
    container_name: marginalia-airflow-dag-processor
    command: dag-processor
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  # Airflow's StatsD metrics as Prometheus metrics. With Airflow, so it always has somewhere to send them.
  statsd-exporter:
    image: prom/statsd-exporter:v0.31.0
    container_name: marginalia-statsd-exporter
    profiles: [airflow]
    restart: unless-stopped
    command: ["--statsd.mapping-config=/etc/statsd/mapping.yml", "--statsd.listen-udp=:9125",
              "--web.listen-address=:9102"]
    volumes:
      - ./docker/observability/statsd-mapping.yml:/etc/statsd/mapping.yml:ro

  # --- Observability (`docker compose --profile observability up -d`): Grafana on 127.0.0.1:3030 ---

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: marginalia-prometheus
    profiles: [observability]
    restart: unless-stopped
    # created-timestamp-zero-ingestion: statsd-exporter creates a counter at its first event, already
    # at 1, which increase() cannot see; with this flag Prometheus adds a 0 at the counter's creation
    # time, so the first batch after an exporter restart is counted.
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=15d", "--web.enable-lifecycle",
              "--enable-feature=created-timestamp-zero-ingestion"]
    ports:
      - "127.0.0.1:${CP_PROMETHEUS_PORT:-9095}:9090"
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:3.7.8
    container_name: marginalia-loki
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./docker/observability/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    # No healthcheck: the image has no shell or HTTP client to run one. Alloy and Grafana retry.

  # Ships every container log of this compose project to Loki (through the Docker socket).
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: marginalia-alloy
    profiles: [observability]
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data",
              "/etc/alloy/config.alloy"]
    environment:
      COMPOSE_PROJECT: marginalia-rag     # the `name:` at the top of this file
    volumes:
      - ./docker/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki: {condition: service_started}

  grafana:
    image: grafana/grafana:13.2.3
    container_name: marginalia-grafana
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CP_GRAFANA_PORT:-3030}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${CP_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${CP_GRAFANA_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/marginalia-service.json
      # The read-only reporting login, for the token and question panels (datasources.yml)
      CP_REPORTING_DB_PASSWORD: ${CP_REPORTING_DB_PASSWORD:-change-me}
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: {condition: service_healthy}
      loki: {condition: service_started}
      db-init: {condition: service_completed_successfully}

  # LLM monitoring (Evidently): the UI on 127.0.0.1:8085, and the job that writes a report to it
  # every hour (marginalia.monitoring) from the read-only reporting views.
  evidently:
    build: {context: ., dockerfile: docker/monitoring/Dockerfile}
    image: marginalia-monitoring:dev
    container_name: marginalia-evidently
    profiles: [observability]
    restart: unless-stopped
    command: ["sh", "-c", "exec evidently ui --workspace /workspace --host 0.0.0.0 --port 8000 --secret \"$$CP_EVIDENTLY_SECRET\""]
    environment:
      CP_EVIDENTLY_SECRET: ${CP_EVIDENTLY_SECRET:-change-me}
    ports:
      - "127.0.0.1:${CP_EVIDENTLY_PORT:-8085}:8000"
    volumes:
      - evidently_workspace:/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/projects')"]
      interval: 15s
      timeout: 5s
      retries: 20

  monitor:
    image: marginalia-monitoring:dev
    container_name: marginalia-monitor
    profiles: [observability]
    restart: unless-stopped
    command: ["python", "-m", "marginalia.monitoring", "--every", "3600"]
    environment:
      CP_REPORTING_DATABASE_URL: postgresql://marginalia_reporting:${CP_REPORTING_DB_PASSWORD:-change-me}@postgres:5432/marginalia
      CP_EVIDENTLY_URL: http://evidently:8000
      CP_EVIDENTLY_SECRET: ${CP_EVIDENTLY_SECRET:-change-me}
      CP_LOG_FORMAT: json
    depends_on:
      evidently: {condition: service_healthy}
      db-init: {condition: service_completed_successfully}

volumes:
  evidently_workspace:
  qdrant_data:
  ollama_models:
  postgres_data:
  redis_data:
  app_models:
  airflow_logs:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:

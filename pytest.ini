[pytest]
testpaths = tests
pythonpath = .
addopts = -m "not integration"
filterwarnings =
    ignore:PyPDF2 is deprecated:DeprecationWarning
    ignore:Payload indexes have no effect in the local Qdrant:UserWarning
markers =
    book: parses the real PDF (a few seconds)
    integration: needs downloaded models, Ollama or the Docker Qdrant; run with -m integration
    agent: the live agent on qwen3:4b, 1-2 minutes per question; run with -m agent
    e2e: product scenarios against a running API and worker; run with -m e2e
